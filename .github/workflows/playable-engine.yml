name: Playable engine

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall thunder_brainstorm.py playable_engine tools tests
      - run: python -m unittest discover -s tests -v
      - run: python tools/generate_training_data.py --seed 7 --count 32 > /tmp/training.jsonl
      - run: test "$(wc -l < /tmp/training.jsonl)" -eq 32
